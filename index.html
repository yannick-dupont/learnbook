<body>
	<br><br><br><br><br><br>
		<div class="col-lg-12 col-md-12">
			<div id="loginbox" class="main-wraper">

				<input id="password" type="password"  /> <br /><br />

				<button id="loginbutton" type="button">Entrez</button>
				<p id="wrongPassword" style="display: none">Mauvais mot de passe</p>

			</div>
		</div>
	</div>

	<script type="text/javascript" src="https://code.jquery.com/jquery-1.12.0.min.js"></script>


	<script type="text/javascript"
		src="https://rawcdn.githack.com/chrisveness/crypto/7067ee62f18c76dd4a9d372a00e647205460b62b/sha1.js"></script>

	<script type="text/javascript">
		"use strict";


		function loadPage(pwd) {

			var hash = pwd;
			hash = Sha1.hash(pwd);
			var url = hash + "/index.html";

			$.ajax({
				url: url,
				dataType: "html",
				success: function (data) {

					window.location = url;

				},
				error: function (xhr, ajaxOptions, thrownError) {


					parent.location.hash = hash;

					//$("#wrongPassword").show();
					$("#password").attr("placeholder", "Mauvais mot de passe");
					$("#password").val("");
				}
			});
		}


		$("#loginbutton").on("click", function () {
			loadPage($("#password").val());
		});
		$("#password").keypress(function (e) {
			if (e.which == 13) {

				loadPage($("#password").val());
			}
		});
		$("#password").focus();

	</script>
